<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo 04 · Repintar sin perder el foco</title>
  <!-- Demo de la mini-clase B · 2.4.3 Orden del foco: repintar una lista con innerHTML destruye el elemento con el foco -->
  <link rel="stylesheet" href="../comun/estilos.css">
  <style>
    .control { background: #fff4de; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; }
    .control label { display: flex; align-items: center; gap: 8px; }
    .control input { width: 20px; height: 20px; }
    .avisos { list-style: none; padding: 0; margin: 0; }
    .avisos li { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #c4cbd1; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
    .avisos li span { margin-right: auto; }
    .leido span { color: #46545b; }
  </style>
</head>
<body>
  <header class="cabecera"><span class="logo">Canal de denuncias</span><a href="#ayuda">Ayuda</a></header>
  <main>
    <h1 id="titulo" tabindex="-1">Avisos sin leer</h1>
    <div class="control">
      <label><input type="checkbox" id="devolver"> Devolver el foco después de repintar (la solución)</label>
    </div>
    <ul class="avisos" id="avisos"></ul>
    <p id="anuncio" class="sr-only" role="status"></p>
  </main>
  <script>
    const avisos = [
      { id: 'a1', texto: 'B-124 ha cambiado a «En curso»', leido: false },
      { id: 'a2', texto: 'Nuevo comentario en B-121', leido: false },
      { id: 'a3', texto: 'B-118 necesita documentación', leido: false },
      { id: 'a4', texto: 'Recordatorio: informe trimestral', leido: false },
    ];
    const lista = document.getElementById('avisos');

    function pintar(aviso) {
      return `
        <li class="${aviso.leido ? 'leido' : ''}">
          <span>${aviso.texto}</span>
          <button type="button" class="secundario" data-clave="${aviso.id}" onclick="alternar('${aviso.id}')">
            ${aviso.leido ? 'Marcar como no leída' : 'Marcar como leída'}
          </button>
        </li>`;
    }

    function repintar() {
      // 1. Recordar qué tenía el foco
      const clave = document.activeElement && document.activeElement.dataset.clave;
      // 2. Repintar toda la lista
      lista.innerHTML = avisos.map(pintar).join('');
      // 3. Devolver el foco (solo si la casilla está marcada, para comparar)
      if (document.getElementById('devolver').checked && clave) {
        lista.querySelector(`[data-clave="${clave}"]`).focus();
      }
    }

    function alternar(id) {
      const aviso = avisos.find((a) => a.id === id);
      aviso.leido = !aviso.leido;
      repintar();
      document.getElementById('anuncio').textContent = aviso.leido ? 'Marcado como leído.' : 'Marcado como no leído.';
    }

    repintar();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis denuncias · Canal de denuncias</title>
  <!-- Laboratorio B · Etapa B1 · Punto de partida con barreras puestas a propósito. -->
  <link rel="stylesheet" href="../comun/estilos.css">
  <style>
    .pestanas { display: flex; gap: 4px; border-bottom: 2px solid #c4cbd1; }
    .pestana { padding: 10px 18px; cursor: pointer; border: 0; background: transparent; color: #46545b; font: inherit; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .pestana.activa { color: #0725d0; border-bottom-color: #0725d0; font-weight: 700; }
    .panel { background: #fff; border: 1px solid #c4cbd1; border-top: 0; border-radius: 0 0 12px 12px; padding: 16px 24px; }
    .panel ul { padding-left: 20px; margin: 0; }
    .panel li { margin: 6px 0; }
  </style>
</head>
<body>
  <header class="cabecera">
    <span class="logo">Canal de denuncias</span>
    <a href="#ayuda">Ayuda</a>
  </header>

  <main>
    <h1>Mis denuncias</h1>
    <p class="intro">Filtra tus denuncias por estado.</p>

    <!-- Pestañas: solo funcionan con ratón -->
    <div class="pestanas">
      <div class="pestana activa" onclick="seleccionar(0)">Pendientes (2)</div>
      <div class="pestana" onclick="seleccionar(1)">En curso (3)</div>
      <div class="pestana" onclick="seleccionar(2)">Cerradas (4)</div>
    </div>
    <div class="panel" id="panel"></div>

    <p style="margin-top: 24px;"><a href="#nueva">Presentar una denuncia nueva</a></p>
  </main>

  <script>
    const DENUNCIAS = [
      ['B-124 · Uso indebido de datos · 20/10/2026', 'B-125 · Acoso laboral · 22/10/2026'],
      ['B-118 · Conflicto de intereses · 02/10/2026', 'B-121 · Acoso laboral · 12/10/2026', 'B-122 · Fraude en compras · 14/10/2026'],
      ['B-081 · Fraude en gastos de viaje', 'B-088 · Conflicto de intereses', 'B-090 · Uso indebido de recursos', 'B-097 · Seguridad laboral'],
    ];
    const pestanas = document.querySelectorAll('.pestana');
    const panel = document.getElementById('panel');

    // Marca la pestaña i como activa y pinta su lista
    function seleccionar(i) {
      pestanas.forEach((pestana, j) => {
        pestana.classList.toggle('activa', i === j);
      });
      panel.innerHTML = '<ul>' + DENUNCIAS[i].map((d) => `<li><a href="#${d.slice(0, 5)}">${d}</a></li>`).join('') + '</ul>';
    }

    seleccionar(0);
  </script>
</body>
</html>
